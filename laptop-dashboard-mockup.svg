<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560">
  <defs>
    <linearGradient id="lidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3852"/>
      <stop offset="1" stop-color="#12213B"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4766"/>
      <stop offset="1" stop-color="#1a2740"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8A33D"/>
      <stop offset="1" stop-color="#17976E"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#12213B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- laptop lid / body -->
  <g filter="url(#softShadow)">
    <rect x="120" y="30" width="560" height="360" rx="18" fill="url(#lidGrad)"/>
    <rect x="136" y="46" width="528" height="328" rx="6" fill="#FCFBF7"/>

    <!-- screen content: dashboard UI -->
    <g>
      <!-- top bar -->
      <rect x="136" y="46" width="528" height="34" fill="#12213B"/>
      <rect x="150" y="57" width="14" height="14" rx="4" fill="url(#accentGrad)"/>
      <text x="170" y="68" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#FCFBF7">IB-TECH ePINs</text>
      <circle cx="600" cy="63" r="4" fill="#17976E"/>
      <circle cx="616" cy="63" r="4" fill="#E8A33D"/>
      <circle cx="632" cy="63" r="4" fill="#C9463F"/>

      <!-- sidebar -->
      <rect x="136" y="80" width="110" height="294" fill="#F1EEE4"/>
      <rect x="150" y="98" width="82" height="10" rx="3" fill="#17976E"/>
      <rect x="150" y="122" width="82" height="8" rx="3" fill="#46557a" opacity="0.5"/>
      <rect x="150" y="140" width="82" height="8" rx="3" fill="#46557a" opacity="0.5"/>
      <rect x="150" y="158" width="82" height="8" rx="3" fill="#46557a" opacity="0.5"/>
      <rect x="150" y="176" width="82" height="8" rx="3" fill="#46557a" opacity="0.5"/>

      <!-- stat cards -->
      <g>
        <rect x="260" y="96" width="128" height="60" rx="8" fill="#FFFFFF" stroke="#DCD6C8"/>
        <rect x="272" y="108" width="50" height="7" rx="3" fill="#46557a" opacity="0.5"/>
        <text x="272" y="138" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#12213B">₦48,200</text>

        <rect x="400" y="96" width="128" height="60" rx="8" fill="#FFFFFF" stroke="#DCD6C8"/>
        <rect x="412" y="108" width="50" height="7" rx="3" fill="#46557a" opacity="0.5"/>
        <text x="412" y="138" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#17976E">312 pins</text>

        <rect x="540" y="96" width="98" height="60" rx="8" fill="#FFFFFF" stroke="#DCD6C8"/>
        <rect x="552" y="108" width="50" height="7" rx="3" fill="#46557a" opacity="0.5"/>
        <text x="552" y="138" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#E8A33D">4 nets</text>
      </g>

      <!-- table of printed cards -->
      <rect x="260" y="172" width="378" height="184" rx="8" fill="#FFFFFF" stroke="#DCD6C8"/>
      <rect x="260" y="172" width="378" height="26" rx="8" fill="#F1EEE4"/>
      <text x="272" y="189" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#12213B">RECENT PRINTS</text>

      <g font-family="Arial, sans-serif" font-size="10" fill="#46557a">
        <rect x="272" y="210" width="16" height="16" rx="3" fill="#f2c744" opacity="0.35"/>
        <rect x="278" y="216" width="4" height="4" fill="#8a6d00"/>
        <text x="298" y="221">MTN — ₦500</text>
        <text x="560" y="221" text-anchor="end">Just now</text>

        <rect x="272" y="238" width="16" height="16" rx="3" fill="#8cc63f" opacity="0.35"/>
        <rect x="278" y="244" width="4" height="4" fill="#4c7a13"/>
        <text x="298" y="249">GLO — ₦200</text>
        <text x="560" y="249" text-anchor="end">2m ago</text>

        <rect x="272" y="266" width="16" height="16" rx="3" fill="#e2544c" opacity="0.3"/>
        <rect x="278" y="272" width="4" height="4" fill="#a12a24"/>
        <text x="298" y="277">AIRTEL — ₦1,000</text>
        <text x="560" y="277" text-anchor="end">6m ago</text>

        <rect x="272" y="294" width="16" height="16" rx="3" fill="#0dae6c" opacity="0.3"/>
        <rect x="278" y="300" width="4" height="4" fill="#0a7a4c"/>
        <text x="298" y="305">9MOBILE — ₦500</text>
        <text x="560" y="305" text-anchor="end">12m ago</text>

        <rect x="272" y="322" width="16" height="16" rx="3" fill="#f2c744" opacity="0.35"/>
        <rect x="278" y="328" width="4" height="4" fill="#8a6d00"/>
        <text x="298" y="333">MTN — ₦100</text>
        <text x="560" y="333" text-anchor="end">18m ago</text>
      </g>
    </g>
  </g>

  <!-- laptop base -->
  <path d="M60 400 L740 400 L700 440 Q400 452 100 440 Z" fill="url(#baseGrad)"/>
  <rect x="360" y="400" width="80" height="6" rx="3" fill="#0d1729"/>
</svg>
